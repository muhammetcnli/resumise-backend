spring.application.name=resumise-backend
# Try both backend/.env and project-root/.env based on run working directory
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database connection settings
spring.datasource.url=jdbc:postgresql://localhost:5433/resumise-db
spring.datasource.username=resumise-user
spring.datasource.password=resumise-password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Show SQL queries in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Google OAuth2 client (session-cookie flow)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Session cookie settings for frontend-backend cross-site auth flow
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:None}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=framework

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

